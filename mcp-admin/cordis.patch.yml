# dsh-mcp-admin bundle layer: one insert that mounts the MCP admin plugin.
# Applied after every profile bundle layer; users override rows by id in their
# profile cordis.patch.yml. The plugin refuses to start until token is set —
# the bearer token is the only guard on the /mcp endpoint.
- insert:
    - id: mcp-admin
      name: dsh-mcp-admin
      config:
        token: ''
        auditLimit: 200
